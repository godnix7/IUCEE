version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbansense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://urbansense:urbansense_pass@db:5432/urbansense_gis
      - SECRET_KEY=urbansense_super_secret_jwt_key_2026_gis_ai_infrastructure
      - PRETRAINED_SEGFORMER_MODEL=nvidia/segformer-b3-finetuned-ade-512-512
      - OVERPASS_API_URL=https://overpass-api.de/api/interpreter
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.3
    container_name: urbansense-db
    environment:
      POSTGRES_USER: urbansense
      POSTGRES_PASSWORD: urbansense_pass
      POSTGRES_DB: urbansense_gis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: urbansense-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
